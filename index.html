<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KLN Login</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .box {
        background: white;
        width: 360px;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
    img {
        width: 140px;
        margin-bottom: 10px;
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
    }
    button {
        background: #6a1b9a;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="box">
    <img src="data:image/png;base64,PASTE_BASE64_HERE" alt="KLN Logo">

    <h3>KLN College of Engineering</h3>

    <input type="text" placeholder="Username" required>
    <input type="password" placeholder="Password" required>
    <button>Login</button>
</div>

</body>
</html>
